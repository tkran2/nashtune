name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NashTune
        run: python -m pip install -e .
      - name: Core tests (games, exact rewards, GRPO math, OpenAI client against a fake server)
        run: python -m unittest discover -s tests -v
      - name: Command line smoke run
        run: |
          nashtune info leduc
          nashtune train --game kuhn --steps 20 --out /tmp/nashtune-ci-run
          nashtune dynamics --quick --out /tmp/nashtune-ci-dynamics
      - name: Install CPU torch, transformers and peft
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
          python -m pip install "transformers>=4.51,<5" "peft>=0.13,<1"
      - name: Torch backend tests (tiny random Qwen2 model, no downloads)
        env:
          NASHTUNE_REQUIRE_TORCH: "1"
        run: python -m unittest discover -s tests -p "test_torch_backend.py" -v
